name: helpyy
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sensors_plus: ^7.1.1
  shared_preferences: ^2.5.5
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  crypto: ^3.0.7
  image_picker: ^1.2.3
  path_provider: ^2.1.6
  dicebear_core: ^10.7.0
  dicebear_styles: ^10.6.0
  flutter_svg: ^2.3.0
  supabase_flutter: ^2.18.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:

  uses-material-design: true
  assets:
    - assets/ringtones/

  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: PatrickHand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
